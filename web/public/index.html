<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>事件质量与结算控制台</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 19l5 5 11-13' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="currentColor" />
          <path d="M8 19l5 5 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div>
          <h1>事件质量与结算控制台</h1>
          <p class="brand-sub">流量质量判定 · 规则版本 · 封存结算 · 差异审批</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="chip" id="tz-chip" title="事件归属时区">时区 —</span>
        <span class="chip" id="operator-chip">操作者 —</span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色主题" title="切换深浅色主题">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3L4.9 4.9M19.1 19.1l-1.4-1.4M17.7 6.3l1.4-1.4M4.9 19.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs" aria-label="主导航">
      <a href="#/overview" data-view="overview">概览</a>
      <a href="#/quality" data-view="quality">流量质量</a>
      <a href="#/rules" data-view="rules">规则版本</a>
      <a href="#/evidence" data-view="evidence">证据</a>
      <a href="#/reports" data-view="reports">差异报告</a>
      <a href="#/settlements" data-view="settlements">结算</a>
      <a href="#/jobs" data-view="jobs">任务队列</a>
    </nav>

    <section class="filterbar" id="filterbar" hidden>
      <div class="filter-group">
        <label for="range-from">起始日</label>
        <input type="date" id="range-from" />
      </div>
      <div class="filter-group">
        <label for="range-to">结束日</label>
        <input type="date" id="range-to" />
      </div>
      <button class="btn" id="range-apply" type="button">应用</button>
      <div class="presets" role="group" aria-label="快捷范围">
        <button class="chip-btn" data-days="7" type="button">近 7 天</button>
        <button class="chip-btn" data-days="3" type="button">近 3 天</button>
      </div>
      <span class="filter-note" id="range-note"></span>
    </section>

    <main id="main" tabindex="-1">
      <div class="loading" id="loading">正在加载…</div>
      <div id="view"></div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title">详情</h2>
        <button class="icon-btn" id="drawer-close" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <div class="tooltip" id="tooltip" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
